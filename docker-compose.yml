services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: spendtracker
      POSTGRES_USER: spend
      POSTGRES_PASSWORD: spend
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend -d spendtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/spendtracker
      SPRING_DATASOURCE_USERNAME: spend
      SPRING_DATASOURCE_PASSWORD: spend

volumes:
  pgdata:
