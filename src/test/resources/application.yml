spring:
  datasource:
    url: jdbc:h2:mem:spendtracker;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  flyway:
    enabled: false

statement:
  mappings:
    bank-a:
      date: "Transaction Date"
      description: "Description"
      debit: "Debit"
      credit: "Credit"
      dateFormat: "dd/MM/yyyy"
    bank-b:
      date: "Date"
      description: "Narrative"
      amount: "Amount"
      dateFormat: "yyyy-MM-dd"

sms:
  templates:
    - name: mada-pos-purchase
      direction: DEBIT
      dateFormat: "dd/MM/yy HH:mm"
      pattern: 'شراء-POS\s*بـ(?<amount>[0-9]+(?:\.[0-9]+)?)\s*(?<currency>[A-Za-z]+)\s*من\s*(?<merchant>[^\n]+?)\s*مدى[^\s]*\s*في\s*(?<date>\d{1,2}/\d{1,2}/\d{2,4})\s+(?<time>\d{1,2}:\d{2})'
