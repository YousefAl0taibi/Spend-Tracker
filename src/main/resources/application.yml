server:
  port: 8080

spring:
  application:
    name: spend-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/spendtracker
    username: spend
    password: spend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

statement:
  mappings:
    bank-a:
      date: "Transaction Date"
      description: "Description"
      debit: "Debit"
      credit: "Credit"
      dateFormat: "dd/MM/yyyy"
    bank-b:
      date: "Date"
      description: "Narrative"
      amount: "Amount"
      dateFormat: "yyyy-MM-dd"

sms:
  templates:
    - name: mada-pos-purchase
      direction: DEBIT
      dateFormat: "dd/MM/yy HH:mm"
      pattern: 'شراء-POS\s*بـ(?<amount>[0-9]+(?:\.[0-9]+)?)\s*(?<currency>[A-Za-z]+)\s*من\s*(?<merchant>[^\n]+?)\s*مدى[^\s]*\s*في\s*(?<date>\d{1,2}/\d{1,2}/\d{2,4})\s+(?<time>\d{1,2}:\d{2})'
